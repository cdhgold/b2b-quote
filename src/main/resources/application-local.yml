# 로컬 개발용. compose.yaml 의 MariaDB 를 사용한다 (docker compose up -d).
spring:
  datasource:
    url: jdbc:mariadb://127.0.0.1:3306/quote_market
    username: quote_local
    password: quote_local   # 로컬 전용 더미 값
  flyway:
    enabled: true
  thymeleaf:
    cache: false

server:
  servlet:
    session:
      cookie:
        secure: false   # 로컬은 http 로 접속

logging:
  level:
    com.b2bmarket.quote: DEBUG
