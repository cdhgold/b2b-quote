# /etc/nginx/nginx.conf  (bootstrap.sh 가 __TOKENS__ 를 치환해 설치)
user __NGINX_USER__;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
__MODULES_INCLUDE__

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    server_tokens off;                      # Spec 6.5: Server 헤더에서 버전 제거
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 30s;
    client_max_body_size 25m;               # PDF 20MB + 여유 (앱에서 파일별 한도 재검증)
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    log_format main '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent" host=$host';
    access_log /var/log/nginx/access.log main;   # 쿼리스트링(토큰 등)은 남기지 않음

    # 요청 제한 (Spec 6.1: IP 당 로그인 시도 제한 / A04: 대량 크롤링 방지)
    limit_req_zone  $binary_remote_addr zone=req_general:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=req_login:10m   rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
