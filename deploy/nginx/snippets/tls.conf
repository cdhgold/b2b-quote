# Mozilla SSL Configuration "Intermediate" (TLS 1.2/1.3) — Spec 7.3
ssl_certificate     /etc/letsencrypt/live/app/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/app/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;

ssl_session_timeout 1d;
ssl_session_cache shared:TLS:10m;
ssl_session_tickets off;
# Let's Encrypt 는 2025년 OCSP 를 종료했으므로 OCSP stapling 은 설정하지 않는다


# HSTS 는 TLS 종단인 Nginx 가 붙인다 (CSP 등 나머지 보안 헤더는 앱이 붙임)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
