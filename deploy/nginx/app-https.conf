# /etc/nginx/conf.d/app-https.conf  (bootstrap.sh 가 __DOMAIN__, __OPS_DOMAIN__ 치환)

# 배포판 기본 Nginx(Ubuntu 22.04: 1.18, Rocky 9: 1.20)와 호환되도록 "listen ... http2" 구문을 사용

upstream app_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# 알 수 없는 Host 로 들어온 요청은 연결을 끊는다
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    include /etc/nginx/snippets/tls.conf;
    return 444;
}

# ---------------------------------------------------------------------------
# 서비스 도메인 (바이어/판매사)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    include /etc/nginx/snippets/tls.conf;

    limit_conn conn_per_ip 50;

    # 운영자 화면은 ops 서브도메인에서만 (Spec 7.2)
    location ^~ /ops/      { return 404; }
    location ^~ /actuator/ { return 404; }

    # 외부 가용성 체크 (Spec 7.6): 관리 포트의 health 만 노출, 상세정보 없음
    location = /health {
        limit_req zone=req_general burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081/actuator/health;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /login {
        limit_req zone=req_login burst=5 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        limit_req zone=req_general burst=40 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# ---------------------------------------------------------------------------
# 운영자 도메인: IP 허용목록 (Spec 4, 7.2)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __OPS_DOMAIN__;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/ops-allow.conf;   # allow <관리자IP>; deny all;

    location ^~ /actuator/ { return 404; }

    location = /login {
        limit_req zone=req_login burst=5 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        limit_req zone=req_general burst=40 nodelay;
        proxy_pass http://app_backend;
        include /etc/nginx/snippets/proxy.conf;
    }
}
