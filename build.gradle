plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.spotbugs' version '6.5.13'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.b2bmarket'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mariadb'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
}

springBoot {
    buildInfo()
}

// 서버에는 실행 JAR 하나만 배포한다 (plain jar 미생성)
tasks.named('jar') { enabled = false }
tasks.named('bootJar') { archiveFileName = 'b2b-quote-market.jar' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters', '-Xlint:all,-processing', '-Werror']
}

tasks.named('test') {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// 정적 분석: SpotBugs + Find Security Bugs (main 코드만, 위반 시 빌드 실패)
// ---------------------------------------------------------------------------
spotbugs {
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
    excludeFilter = file('config/spotbugs/exclude.xml')
}
tasks.named('spotbugsTest') { enabled = false }
// Spring 의존성 관리가 SpotBugs 실행 클래스패스의 commons-lang3 를 낮은 버전으로 내리는 문제 방지
configurations.matching { it.name.startsWith('spotbugs') }.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
            details.useVersion '3.19.0'
        }
    }
}
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports { html { required = true } }
}

// ---------------------------------------------------------------------------
// 의존성 취약점: OWASP Dependency-Check (CVSS 7 이상이면 실패)
// CI에서는 NVD_API_KEY 시크릿으로 실행. 로컬: ./gradlew dependencyCheckAnalyze
// ---------------------------------------------------------------------------
dependencyCheck {
    failBuildOnCVSS = 7.0f
    formats = ['HTML', 'SARIF']
    suppressionFile = 'config/dependency-check/suppressions.xml'
    scanConfigurations = ['runtimeClasspath']
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
    }
    analyzers {
        assemblyEnabled = false
        nodeEnabled = false
        nodeAuditEnabled = false
        ossIndexEnabled = false
    }
}

// ---------------------------------------------------------------------------
// 보안 린트 (Spec 6.3 A03)
//  - MyBatis: `${}` 금지. 화이트리스트 정렬컬럼 등 불가피한 경우에만
//    바로 윗줄에 `SAFE-DOLLAR: <사유>` 주석을 달아 예외 처리한다.
//  - Thymeleaf: th:utext 금지
// ---------------------------------------------------------------------------
def securityLint = tasks.register('securityLint') {
    group = 'verification'
    description = 'MyBatis ${} 사용과 Thymeleaf th:utext 사용을 차단합니다.'
    def mapperFiles = fileTree('src/main/resources') { include '**/*.xml' }
    def javaFiles = fileTree('src/main/java') { include '**/*.java' }
    def templateFiles = fileTree('src/main/resources/templates') { include '**/*.html' }
    inputs.files(mapperFiles, javaFiles, templateFiles)
    def marker = layout.buildDirectory.file('securityLint/ok')
    outputs.file(marker)
    doLast {
        def violations = []
        (mapperFiles.files + javaFiles.files).each { f ->
            def lines = f.readLines('UTF-8')
            lines.eachWithIndex { line, i ->
                // Java 쪽은 @Value("${...}") 프로퍼티 주입만 허용 (어노테이션 SQL 등은 차단)
                def isJava = f.name.endsWith('.java')
                if (line.contains('${') && !(isJava && line.contains('@Value('))) {
                    def prev = i > 0 ? lines[i - 1] : ''
                    if (!prev.contains('SAFE-DOLLAR:')) {
                        violations << "${f}:${i + 1}: MyBatis \${} 사용 금지 (#{} 사용)"
                    }
                }
            }
        }
        templateFiles.files.each { f ->
            f.readLines('UTF-8').eachWithIndex { line, i ->
                if (line.contains('th:utext')) {
                    violations << "${f}:${i + 1}: th:utext 사용 금지 (th:text 사용)"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('보안 린트 위반:\n' + violations.join('\n'))
        }
        def out = marker.get().asFile
        out.parentFile.mkdirs()
        out.text = 'ok'
    }
}
tasks.named('check') { dependsOn securityLint }
